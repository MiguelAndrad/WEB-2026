<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWEB1 — Cap. 07 — AT01 — Cartão de Apresentação</title>

    <Style>
        body {
            font-family: Arial, sans-serif;
            background-color: gray;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .cartao {
            background-color: white;
            border-radius: 10px;
            padding: 2rem;
            width: 300px;
            margin: 30px auto;
            border: 1px solid #ccc;
        }

        .cartao-nome {
            font-size: 2rem;
            font-weight: bold;
            color: #259;
            margin-bottom: 10px;
        }

        hr {
            width: 90%;
        }

        .cartao-divisor {
            border: 2px dashed black;
        }

        .cartao-cargo {
            font-style: italic;
            color: #555;
        }

        .cartao-email {
            font-size: 0.9rem;
            color: #777;
        }
    </Style>
</head>

<body>

    <header>
        <h1> Cartão de Apresentação</h1>
        <p><a href="../index.html"> Voltar para a página principal</a></p>
    </header>

    <main>
        <article class="cartao">
            <h1 class="cartao-nome">Miguel Andrade</h1>
            <hr class="cartao-divisor">

            <p class="cartao-cargo">
                Estudante de Sistemas de Informação — IFAL
            </p>

            <p class="cartao-email">
                mam15@aluno.ifal.edu.br
            </p>
        </article>
    </main>

</body>

</html>
